services:
  - type: web
    name: tunspro
    runtime: python
    plan: starter
    buildCommand: python --version
    startCommand: python server.py
    disk:
      name: tunspro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TUNSPRO_DB
        value: /var/data/tunspro.sqlite3
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
